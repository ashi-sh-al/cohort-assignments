<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <nav>
        <img class="logo" src="./images/logo.png" alt="logo" />
        <div class="nav-links">
          <a href="#">About</a>
          <a href="#">Watch Now</a>
          <a href="#">Actors</a>
          <a href="#">Contact</a>
        </div>
        <img class="menu-icon" src="./images/menu-3-line.png" alt="menu icon" />
      </nav>
    </header>

    <main>
      <div class="hero">
        <div class="hero-left">
          <div class="logo-container">
            <img class="blue-star" src="./images/shining-fillBlue.png" alt="">
            <img class="yellow-star" src="./images/shining-fillYellow.png" alt="">
            <img class="logo-img" src="./images/logo.png" alt="logo" />
          </div>
          <p class="hero-text">
            Action / Thriller / Drama Series directed by Dong-hyuk Hwang Season
            1:9 Episodes
          </p>

          <div class="hero-btn">
            <button class="play-now-btn">
              <img src="./images/play-fill-black.png" alt="play black" />Play
              Now
            </button>
            <button class="watch-btn">
              <img src="./images/play-line.png" alt="play icon" />Watch Trailer
            </button>
          </div>
        </div>

        <div class="squid-character-container">
          <img
            class="squid-character"
            src="./images/squid-character.png"
            alt="squid character"
          />
          <div class="socialmedia-icons">
            <img src="./images/twitter-line.png" alt="Twitter" />
            <img src="./images/instagram-line.png" alt="Instagram" />
            <img src="./images/facebook-fill.png" alt="Facebook" />
          </div>
          <div class="scroll">
            <hr />
            <p>SCROLL</p>
          </div>
        </div>
      </div>

      <h5 class="game-text">GAME</h5>
      <h5 class="squid-text">SQUID</h5>

      <div class="card-container">
        <div class="card">
          <img
            class="squid-game-img"
            src="./images/squid-1.jfif"
            alt="squid game image"
          />
          <img
            class="play-btn"
            src="./images/play-fill-white.png"
            alt="play btn white"
          />
        </div>

        <div class="card">
          <img
            class="squid-game-img"
            src="./images/squid-2.jpg"
            alt="squid game image"
          />
          <img
            class="play-btn"
            src="./images/play-fill-white.png"
            alt="play btn white"
          />
        </div>

        <div class="card">
          <img
            class="squid-game-img"
            src="./images/squid-3.jfif"
            alt="squid game image"
          />
          <img
            class="play-btn"
            src="./images/play-fill-white.png"
            alt="play btn white"
          />
        </div>
      </div>
    </main>
  </body>
</html>
