<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Art Work</title>

    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="main">
      <h1>Explore Art Work</h1>
      <div class="cards-container">
        <div class="card">
          <img class="art-img" src="./images/card-1.jpg" alt="" />
          <div class="title-container">
            <h3 class="title">Monocular</h3>
            <p class="likes">
              54.8k
              <img src="./images/poker-hearts-line.png" alt="heart logo" />
            </p>
          </div>
          <button class="place-bid">Place Bid</button>
        </div>

        <div class="card">
          <img class="art-img" src="./images/card-2.jpg" alt="" />
          <div class="title-container">
            <h3 class="title">Horns Mask</h3>
            <p class="likes">
              32.4k
              <img src="./images/poker-hearts-line.png" alt="heart logo" />
            </p>
          </div>
          <button class="place-bid">Place Bid</button>
        </div>

        <div class="card">
          <img class="art-img" src="./images/card-3.jpg" alt="" />
          <div class="title-container">
            <h3 class="title">Light Moon</h3>
            <p class="likes">
              86.6k
              <img src="./images/poker-hearts-line.png" alt="heart logo" />
            </p>
          </div>
          <button class="place-bid">Place Bid</button>
        </div>

        <div class="card">
          <img class="art-img" src="./images/card-4.jfif" alt="" />
          <div class="title-container">
            <h3 class="title">Skull Wire</h3>
            <p class="likes">
              78.9k
              <img src="./images/poker-hearts-line.png" alt="heart logo" />
            </p>
          </div>
          <button class="place-bid">Place Bid</button>
        </div>

        <div class="card">
          <img class="art-img" src="./images/card-5.jfif" alt="" />
          <div class="title-container">
            <h3 class="title">Spiderman</h3>
            <p class="likes">
              24.8k
              <img src="./images/poker-hearts-line.png" alt="heart logo" />
            </p>
          </div>
          <button class="place-bid">Place Bid</button>
        </div>

        <div class="card">
          <img class="art-img" src="./images/card-6.jpg" alt="" />
          <div class="title-container">
            <h3 class="title">Deadpool</h3>
            <p class="likes">
              59.7k
              <img src="./images/poker-hearts-line.png" alt="heart logo" />
            </p>
          </div>
          <button class="place-bid">Place Bid</button>
        </div>

        <div class="card">
          <img class="art-img" src="./images/card-7.jfif" alt="" />
          <div class="title-container">
            <h3 class="title">White Eye</h3>
            <p class="likes">
              45.7k
              <img src="./images/poker-hearts-line.png" alt="heart logo" />
            </p>
          </div>
          <button class="place-bid">Place Bid</button>
        </div>

        <div class="card">
          <img class="art-img" src="./images/card-8.jfif" alt="" />
          <div class="title-container">
            <h3 class="title">Plastic Spinal</h3>
            <p class="likes">
              98.6k
              <img src="./images/poker-hearts-line.png" alt="heart logo" />
            </p>
          </div>
          <button class="place-bid">Place Bid</button>
        </div>
      </div>
    </main>
  </body>
</html>
