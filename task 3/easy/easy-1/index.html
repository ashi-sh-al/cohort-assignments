<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <nav class="nav-bar">
            <div class="logo">
                <img src="./images/scaleX-logo.png" alt="scaleX logo">
            </div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Blogs</a>
                <a href="#">Contact Us</a>
            </div>
            <div class="nav-button">
                <button>Get Started</button>
            </div>
        </nav>
        <main class="main">
            <section class="hero">
                <h1 class="hero-text">
                    Insights & Blogs
                </h1>
            </section>

            <section class="category">
                <button>All</button>
                <button>Tech</button>
                <button>SaaS</button>
                <button>Marketing</button>
            </section>

            <section class="cards">
                <div class="card">
                    <img src="./images/card-1.jfif" alt="SaaS Marketing">
                    <button>Tech</button>
                    <h3>The Ultimate Guide To SaaS Marketing</h3>
                    <h5>May 23,2025</h5>
                </div>

                <div class="card">
                    <img src="./images/card-2.jpg" alt="Key Trends in SaaS">
                    <button>SaaS</button>
                    <h3>5 Key Trends In SaaS Growth For 2025</h3>
                    <h5>May 23, 2025</h5>
                </div>

                <div class="card">
                    <img src="./images/card-3.jpg" alt="Data-Driven Strategies">
                    <button>Marketing</button>
                    <h3>How Data-Driven Strategies Are Important</h3>
                    <h5>May 23, 2025</h5>
                </div>
            </section>
        </main>
    </header>
</body>
</html>
